AWSTemplateFormatVersion: '2010-09-09'
Description: 'Hobby Hub isolated listing publication and Stock V2 audit ledgers (no writers, no endpoints)'
Resources:
  StockV2Audit:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: HobbyHub
        - Key: Environment
          Value: sandbox
  PublicationApprovals:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: HobbyHub
        - Key: Environment
          Value: sandbox
Outputs:
  StockV2AuditTable:
    Value: !Ref StockV2Audit
  PublicationApprovalsTable:
    Value: !Ref PublicationApprovals
